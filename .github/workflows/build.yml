on:
  pull_request:
  push:
    branches: [ 'master' ]
    tags: [ 'v*.*.*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          if ('${{ github.event_name == 'push' && github.ref_type == 'tag' }}' -eq 'true') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v'
          } else {
            $ver = '0.0.0'
          }

          # Framework-dependent build, consumed by the Inno Setup installer.
          dotnet.exe publish AutoAudioSwitcher -o publish -p:Version="$ver"

          # Self-contained single-file build. This is what the in-app updater downloads, so
          # CanSelfUpdate requires that no sibling AutoAudioSwitcher.dll exists next to the exe.
          dotnet.exe publish AutoAudioSwitcher -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version="$ver" -o portable

          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\Setup\Setup.iss

      - name: Create release draft
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/'
          $setup = 'Setup\Output\AutoAudioSwitcher-Setup.exe'
          $portable = 'portable\AutoAudioSwitcher.exe'

          # Optional per-release notes, so the Chinese description does not have to be pasted by hand after every
          # tag. Convention: .github/release-notes/<tag>.md, e.g. .github/release-notes/v1.1.1.md
          $notes = ".github\release-notes\$tag.md"
          if (Test-Path $notes) {
            gh release create --draft --title $tag --notes-file $notes $tag $setup $portable
          } else {
            gh release create --draft --title $tag $tag $setup $portable
          }
